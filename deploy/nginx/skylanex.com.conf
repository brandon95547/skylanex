# skylanex.com — Skylanex static site (/var/www/skylanex). Forces https + www.

# Rate-limit bucket for the contact form, declared HERE rather than in nginx.conf.
# This file is included from conf.d/, which is already inside http{}, so this is the
# right context — and keeping it beside the location that uses it means the vhost
# cannot be copied to a server without its zone. A missing zone is not a soft
# failure: nginx refuses to start with "unknown limit_req zone".
#
# 10r/m with burst=3 is well above what a person filling in a form does and well
# below what a script does. 1m of state holds ~16k addresses.
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name skylanex.com www.skylanex.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.skylanex.com$request_uri; }
}

# Non-www HTTPS -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skylanex.com;

    ssl_certificate /etc/letsencrypt/live/skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skylanex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.skylanex.com$request_uri;
}

# Canonical www HTTPS -> serve the static site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skylanex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/skylanex/dist;
    index index.html;

    # Don't leak the nginx version (best set globally in http{} too).
    server_tokens off;

    # Security headers. `always` so they're sent on error responses (e.g. 404) too.
    # CSP is tuned to what the site actually loads: same-origin CSS/JS/fonts/media and
    # inline style="" attributes. No inline/executable scripts, and no external hosts
    # at all since the webfonts were brought in-house (see src/styles/app.css).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /api/contact {
        # Defence in depth. phansora-api caps message size and allows 5/hour per IP,
        # but without these every junk request still travels into Python first, and
        # nginx would accept a 1MB body (the default) for a form that needs ~8KB.
        client_max_body_size 16k;
        limit_req zone=contact burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;
    # `internal` so the page is reachable ONLY via the error_page redirect above.
    # Requested directly it used to answer 200, which is an indexable thin page
    # saying "Page not found" — a soft 404 in Search Console's terms.
    location = /404.html { internal; }
    # `expires` alone sets Cache-Control; no explicit add_header here so this
    # location keeps inheriting the security headers above (nginx drops inherited
    # add_headers from any location that declares its own).
    location ~* \.(css|js|svg|woff2?|png|jpe?g|webp|ico)$ { expires 7d; }
}
