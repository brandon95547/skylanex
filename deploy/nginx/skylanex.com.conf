# skylanex.com — Skylanex static site (/var/www/skylanex). Forces https + www.

# Rate-limit bucket for the contact form, declared HERE rather than in nginx.conf.
# This file is included from conf.d/, which is already inside http{}, so this is the
# right context — and keeping it beside the location that uses it means the vhost
# cannot be copied to a server without its zone. A missing zone is not a soft
# failure: nginx refuses to start with "unknown limit_req zone".
#
# 10r/m with burst=3 is well above what a person filling in a form does and well
# below what a script does. 1m of state holds ~16k addresses.
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

# Shot Matrix (/products/shot-matrix) is a free tool that starts three browsers per run,
# so it gets its own buckets, split by how often a real visitor makes each request:
#
#   run  starting a run: rare and expensive. 6r/m, burst 2.
#   api  everything else: cheap and frequent. An open run polls every 1.5s and its page
#        loads up to 24 thumbnails and the full-page shots a visitor opens. 10r/s, burst 80.
#   zip  downloading a whole run: a few MB to tens of MB each. 6r/m, burst 2.
#
# The service keeps its own per-visitor allowances (6 runs an hour, 20 a day, one at a
# time) and a proof-of-work check. These only turn a flood away before Node sees it.
limit_req_zone $binary_remote_addr zone=shotmatrix_run:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=shotmatrix_api:2m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shotmatrix_zip:1m rate=6r/m;
server {
    listen 80;
    listen [::]:80;
    server_name skylanex.com www.skylanex.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.skylanex.com$request_uri; }
}

# Non-www HTTPS -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skylanex.com;

    ssl_certificate /etc/letsencrypt/live/skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skylanex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.skylanex.com$request_uri;
}

# Canonical www HTTPS -> serve the static site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skylanex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/skylanex/dist;
    index index.html;

    # Don't leak the nginx version (best set globally in http{} too).
    server_tokens off;

    # Security headers. `always` so they're sent on error responses (e.g. 404) too.
    # CSP is tuned to what the site actually loads: same-origin CSS/JS/fonts/media and
    # inline style="" attributes. No inline/executable scripts, and no external hosts
    # at all since the webfonts were brought in-house (see src/styles/app.css).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /api/contact {
        # Defence in depth. phansora-api caps message size and allows 5/hour per IP,
        # but without these every junk request still travels into Python first, and
        # nginx would accept a 1MB body (the default) for a form that needs ~8KB.
        client_max_body_size 16k;
        limit_req zone=contact burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shot Matrix — the service is a Docker container on 127.0.0.1:4700, run by
    # shotmatrix.service (github.com/brandon95547/shotmatrix, deploy/). It serves
    # everything under /api/shotmatrix itself, so the path passes through unchanged.
    #
    # ^~ matters: without it the regex location for static assets below would claim
    # /api/shotmatrix/runs/…/x.png and look for it in dist/.
    #
    # No add_header in these blocks, so they keep inheriting the security headers set at
    # server level. Rate-limited requests get JSON back rather than nginx's HTML page,
    # because the tool shows the message to the visitor.
    location = /api/shotmatrix/jobs {
        limit_req zone=shotmatrix_run burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @shotmatrix_limited;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/shotmatrix/ {
        limit_req zone=shotmatrix_api burst=80 nodelay;
        limit_req_status 429;
        error_page 429 = @shotmatrix_limited;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;

        location ~ ^/api/shotmatrix/runs/[\w-]+/zip$ {
            limit_req zone=shotmatrix_zip burst=2 nodelay;
            limit_req_status 429;
            error_page 429 = @shotmatrix_limited;
            proxy_pass http://127.0.0.1:4700;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
    location @shotmatrix_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests at once. Wait a minute and try again.","code":"rate"}';
    }

    # /work moved to /products. A 301 rather than letting it 404, because the old path
    # has been the linked one since the site launched and is what search engines hold —
    # and because a permanent redirect is the only way to pass that standing on. Exact
    # match, so it costs one string comparison and cannot shadow anything below it.
    location = /work { return 301 /products; }
    location = /work/ { return 301 /products; }

    # HTML. Assets never reach here: the regex location below wins over this prefix
    # match, so this block is effectively "the pages".
    #
    # no-cache does NOT mean "don't cache" — it means "revalidate before reusing".
    # Without it these responses carry only ETag/Last-Modified, so a browser applies
    # its own heuristic freshness and can serve yesterday's page after a deploy. The
    # ETag then makes revalidation a 304, so the cost is one conditional request.
    #
    # EVERY security header is repeated here, and that repetition is load-bearing:
    # nginx drops all inherited add_headers from any location that declares even one
    # of its own. Adding Cache-Control alone would silently strip the CSP, HSTS and
    # the rest from every page on the site. If you add a header at server level, add
    # it here too.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'" always;
    }
    error_page 404 /404.html;
    # `internal` so the page is reachable ONLY via the error_page redirect above.
    # Requested directly it used to answer 200, which is an indexable thin page
    # saying "Page not found" — a soft 404 in Search Console's terms.
    location = /404.html { internal; }
    # `expires` alone sets Cache-Control; no explicit add_header here so this
    # location keeps inheriting the security headers above (nginx drops inherited
    # add_headers from any location that declares its own).
    location ~* \.(css|js|svg|woff2?|png|jpe?g|webp|ico)$ { expires 7d; }
}
